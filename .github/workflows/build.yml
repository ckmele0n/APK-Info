name: Build

# Every push compiles APK-Info.exe and builds the full package.
# On master it also publishes a GitHub release named after $ProgramVersion
# in APK-Info.au3 (tag "1.36" etc.). If that release already exists,
# its package is replaced. Bump $ProgramVersion for a new release.

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install AutoIt
        run: choco install autoit -y --no-progress

      - name: Syntax check
        shell: pwsh
        run: |
          $au = "${env:ProgramFiles(x86)}\AutoIt3"
          $p = Start-Process "$au\Au3Check.exe" -ArgumentList '-q', 'Application-source\APK-Info.au3' -NoNewWindow -Wait -PassThru
          if ($p.ExitCode -gt 1) { exit 1 }

      - name: Compile
        shell: pwsh
        run: |
          $au = "${env:ProgramFiles(x86)}\AutoIt3"
          Start-Process "$au\Aut2Exe\Aut2exe.exe" -ArgumentList '/in', 'Application-source\APK-Info.au3', '/out', "$PWD\APK-Info.exe", '/icon', 'Application-source\APK-Info.ico', '/x86', '/nopack' -Wait
          if (!(Test-Path APK-Info.exe)) { Write-Error 'APK-Info.exe not created'; exit 1 }
          Get-Item APK-Info.exe

      - name: Assemble full package (over APK-Info 1.35)
        id: pkg
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = (Select-String -Path Application-source\APK-Info.au3 -Pattern '^\$ProgramVersion = "(.+)"').Matches[0].Groups[1].Value
          "version=$ver" >> $env:GITHUB_OUTPUT
          New-Item -ItemType Directory -Force old, pkg | Out-Null
          gh release download 1.35 --repo Enyby/APK-Info --dir old
          Get-ChildItem old
          $zip = Get-ChildItem old -Filter *.zip | Sort-Object Length -Descending | Select-Object -First 1
          if (!$zip) { Write-Error 'No zip in the 1.35 release'; exit 1 }
          Expand-Archive $zip.FullName -DestinationPath pkg
          $root = (Get-ChildItem pkg -Recurse -Filter APK-Info.exe | Select-Object -First 1).DirectoryName
          if (!$root) { $root = (Resolve-Path pkg).Path }
          Copy-Item APK-Info.exe, APK-Info.ini, README.md -Destination $root -Force
          if (Test-Path (Join-Path $root 'Documents')) { Copy-Item Documents\Changelog.txt -Destination (Join-Path $root 'Documents') -Force }
          if (Test-Path (Join-Path $root 'Application-source')) { Copy-Item Application-source\* -Destination (Join-Path $root 'Application-source') -Force }
          Get-ChildItem $root -Recurse | Select-Object FullName, Length | Format-Table -AutoSize
          Compress-Archive -Path (Join-Path $root '*') -DestinationPath "APK-Info-$ver.zip" -Force
          # release notes = newest section of the changelog
          $log = Get-Content Documents\Changelog.txt -Raw
          $parts = $log -split '(?m)^\*\*\* '
          ($parts[1] -split "`n", 2)[1].Trim() | Set-Content notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: APK-Info-${{ steps.pkg.outputs.version }}
          path: APK-Info-${{ steps.pkg.outputs.version }}.zip

      - name: Release
        if: github.ref == 'refs/heads/master'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = '${{ steps.pkg.outputs.version }}'
          gh release view $ver *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $ver "APK-Info-$ver.zip" --clobber
            gh release edit $ver --notes-file notes.md
          } else {
            gh release create $ver "APK-Info-$ver.zip" --target $env:GITHUB_SHA --title "APK-Info $ver" --notes-file notes.md --latest
          }
