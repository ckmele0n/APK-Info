name: Build

on:
  push:
    branches-ignore: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install AutoIt
        run: choco install autoit -y --no-progress

      - name: Syntax check
        shell: pwsh
        run: |
          $au = "${env:ProgramFiles(x86)}\AutoIt3"
          $p = Start-Process "$au\Au3Check.exe" -ArgumentList '-q', 'Application-source\APK-Info.au3' -NoNewWindow -Wait -PassThru
          if ($p.ExitCode -gt 1) { exit 1 }

      - name: Compile
        shell: pwsh
        run: |
          $au = "${env:ProgramFiles(x86)}\AutoIt3"
          Start-Process "$au\Aut2Exe\Aut2exe.exe" -ArgumentList '/in', 'Application-source\APK-Info.au3', '/out', "$PWD\APK-Info.exe", '/icon', 'Application-source\APK-Info.ico', '/x86', '/nopack' -Wait
          if (!(Test-Path APK-Info.exe)) { Write-Error 'APK-Info.exe not created'; exit 1 }
          Get-Item APK-Info.exe

      - uses: actions/upload-artifact@v4
        with:
          name: APK-Info
          path: |
            APK-Info.exe
            APK-Info.ini
